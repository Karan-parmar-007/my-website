name: Build and Deploy FastAPI Backend

on:
  push:
    branches: [ master, main ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
   
    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Setup Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install flake8 mypy



  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
   
    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Log in to Docker Hub
      uses: docker/login-action@v4
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v7
      with:
        context: .
        push: true
        tags: |
          ${{ secrets.DOCKERHUB_USERNAME }}/portfolio-backend:latest
          ${{ secrets.DOCKERHUB_USERNAME }}/portfolio-backend:${{ github.sha }}
        cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/portfolio-backend:latest
        cache-to: type=inline

    - name: Deploy to server
      uses: appleboy/ssh-action@v1
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        passphrase: ${{ secrets.SSH_PASSPHRASE }}
        script: |
          cd /opt/my_portfolio
         
          echo "🔄 Pulling latest backend image..."
          docker pull ${{ secrets.DOCKERHUB_USERNAME }}/portfolio-backend:latest

          echo "🛑 Stopping backend service..."
          docker compose stop backend
         
          echo "🔄 Running database migrations..."
          docker compose run --rm backend alembic upgrade head
         
          echo "📊 Running bootstrap script..."
          docker compose run --rm backend python bootstrap_data.py
         
          echo "🚀 Starting backend service..."
          docker compose up -d backend
         
          echo "⏳ Waiting for backend to be ready..."
          sleep 20
         
          echo "🔄 Restarting nginx to refresh connections..."
          docker compose restart nginx
         
          echo "🧹 Cleaning up old images..."
          docker image prune -f
         
          echo "📊 Checking service status..."
          docker compose ps
         
          echo "🔍 Testing backend health..."
          sleep 5
          # Test profile endpoint as health check
          curl -f http://localhost/api/v1/portfolio/profile-info || echo "⚠️ Backend API test failed (might be expected if no profile exists)"
         
          echo "📋 Checking backend logs..."
          docker compose logs --tail=50 backend
         
          echo "✅ Backend deployed successfully!"